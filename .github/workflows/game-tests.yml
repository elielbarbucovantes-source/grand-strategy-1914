name: Tests du jeu (Godot 4.7.2)

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "data/game/**"
      - "data/rules/**"
      - "data/scenarios/**"
      - "data/history/**"
      - "tools/export/**"
      - "project.godot"
      - ".github/workflows/game-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/game/**"
      - "data/rules/**"
      - "data/scenarios/**"
      - "data/history/**"
      - "tools/export/**"
      - "project.godot"
      - ".github/workflows/game-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    name: Données exportées, tests de simulation et d'interface (sans interface graphique)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/map/requirements.lock
      - name: Dépendances GIS épinglées
        run: python -m pip install --no-deps -r tools/map/requirements.lock
      - name: Exports reproductibles (NP-0 et scénario)
        run: |
          python tools/export/build_game_data.py --check
          python tools/export/build_scenario.py --check
      - name: Installer Godot 4.7.2 (binaire officiel, SHA-512 vérifié)
        run: |
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}
          F=Godot_v${GODOT_VERSION}_linux.x86_64
          curl -sSLf -o "$F.zip" "$B/$F.zip"
          curl -sSLf -o SHA512-SUMS.txt "$B/SHA512-SUMS.txt"
          grep " $F.zip$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$F.zip" && chmod +x "$F"
          echo "GODOT=$PWD/$F" >> "$GITHUB_ENV"
      - name: Tests (simulation et interface)
        run: bash tests/run.sh
